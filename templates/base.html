<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Управление ДДС{% endblock %}</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { 
            background: #f0f2f5; 
            padding-top: 20px; 
        }
        
        .navbar-custom {
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            border-radius: 0 0 12px 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-width: 500px;
            transition: all 0.3s ease;
        }
        .navbar-custom .navbar-brand {
            color: white !important;
            font-weight: 500;
            font-size: 1.25rem;
            text-decoration: none;
            white-space: nowrap;
        }
        .navbar-custom .nav {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }
        .navbar-custom .nav-link {
            color: white !important;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            white-space: nowrap;
            transition: background 0.3s ease;
        }
        .navbar-custom .nav-link:hover {
            background: rgba(255,255,255,0.1);
        }
        .navbar-custom .nav-link.active {
            background: rgba(255,255,255,0.2);
        }
        
        .container {
            min-width: 500px;
            transition: all 0.3s ease;
        }
        
        .card-main {
            background: white;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            border: none;
            padding: 20px;
            margin-bottom: 20px;
        }
        .btn-primary-custom {
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            color: white;
            transition: all 0.3s;
        }
        .btn-primary-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(26,115,232,0.3);
        }
        .btn-success-custom {
            background: linear-gradient(135deg, #34a853, #1e7e34);
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            color: white;
            transition: all 0.3s;
        }
        .btn-success-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(52,168,83,0.3);
        }
        .btn-danger-custom {
            background: linear-gradient(135deg, #ea4335, #c62828);
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            color: white;
            transition: all 0.3s;
        }
        .btn-danger-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(234,67,53,0.3);
        }
        .btn-outline-custom {
            background: transparent;
            border: 2px solid #1a73e8;
            color: #1a73e8;
            border-radius: 8px;
            padding: 6px 16px;
            transition: all 0.3s;
        }
        .btn-outline-custom:hover {
            background: #1a73e8;
            color: white;
        }
        .filter-section {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }
        .table-custom {
            border-radius: 12px;
            overflow: hidden;
        }
        .table-custom thead {
            background: #f8f9fa;
        }
        .required-field::after {
            content: " *";
            color: #ea4335;
        }
        .errorlist {
            color: #dc3545;
            list-style: none;
            padding: 0;
            font-size: 0.875rem;
        }
        .alert {
            border-radius: 12px;
            border: none;
        }
        .alert-success {
            background: #d4edda;
            color: #155724;
        }
        .alert-error {
            background: #f8d7da;
            color: #721c24;
        }
        .alert-warning {
            background: #fff3cd;
            color: #856404;
        }
        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
        }
        .btn {
            border-radius: 8px;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="container">
        <!-- Навигация -->
        <nav class="navbar-custom mb-4">
            <a class="navbar-brand" href="{% url 'cashflow:index' %}">
                <i class="bi bi-wallet2 me-2"></i>Управление ДДС
            </a>
            <ul class="nav">
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/' %}active{% endif %}" 
                       href="{% url 'cashflow:index' %}">
                        <i class="bi bi-table me-1"></i>Записи
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if '/directories/' in request.path %}active{% endif %}" 
                       href="{% url 'cashflow:directory_list' %}">
                        <i class="bi bi-gear me-1"></i>Справочники
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Сообщения -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                    <i class="bi 
                        {% if message.tags == 'success' %}bi-check-circle{% endif %}
                        {% if message.tags == 'error' %}bi-exclamation-circle{% endif %}
                        {% if message.tags == 'warning' %}bi-exclamation-triangle{% endif %}
                        {% if message.tags == 'info' %}bi-info-circle{% endif %}
                    me-2"></i>
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        <!-- Основной контент -->
        {% block content %}{% endblock %}
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
